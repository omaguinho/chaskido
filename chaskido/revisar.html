<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chaskido · revisar archivos</title>
  <style>
    body { margin: 0; padding: 16px; font: 15px/1.4 system-ui, sans-serif; background: #1b1035; color: #fbf6ec; }
    h1 { font-size: 20px; margin: 0 0 4px; color: #ffd34d; }
    h2 { font-size: 16px; margin: 20px 0 6px; }
    p { margin: 4px 0 12px; color: #c9c2d6; }
    .sum { padding: 10px 12px; border-radius: 8px; background: #2e2a47; margin: 12px 0; }
    ul { list-style: none; padding: 0; margin: 0; columns: 2 260px; }
    li { padding: 2px 0; break-inside: avoid; font-family: monospace; font-size: 13px; }
    .ok { color: #7bd389; }
    .no { color: #ff6b8a; }
    .wait { color: #9a93b0; }
  </style>
</head>
<body>
  <!-- Revisa qué dibujos y músicas están en assets/ con el nombre exacto.
       Se abre igual que el juego (en Acode o con doble clic) desde la carpeta chaskido/. -->
  <h1>Chaskido · ¿están todos los archivos?</h1>
  <p>Verde: está. Rojo: falta o tiene otro nombre. El juego funciona aunque falten: dibuja un reemplazo simple en su lugar.</p>
  <div class="sum" id="sum">Revisando…</div>
  <div id="groups"></div>

 "tiles_tech.png", "tiles_tech_extra.png", "tiles_tower.png", "tiles_tower_extra.png", "totem_activo.png", "totem_apagado.png", "totem_despierto.png", "totem_viaje.png", "viento.png"], "assets/bg/": ["bg_bamboo_far.png", "bg_bamboo_mid.png", "bg_bamboo_near.png", "bg_cave_far.png", "bg_cave_mid.png", "bg_cave_near.png", "bg_city_far.png", "bg_city_mid.png", "bg_city_near.png", "bg_cityday_far.png", "bg_cityday_mid.png", "bg_cityday_near.png", "bg_coliseo_far.png", "bg_coliseo_mid.png", "bg_coliseo_near.png", "bg_mine_far.png", "bg_mine_mid.png", "bg_mine_near.png", "bg_salita_bonus.png", "bg_salita_descanso.png", "bg_salita_tienda.png", "bg_sea_far.png", "bg_sea_mid.png", "bg_sea_near.png", "bg_tech_far.png", "bg_tech_mid.png", "bg_tech_near.png", "logo.png", "placa_piso.png", "portada.png", "retrato_bombo.png", "retrato_charanguero.png", "retrato_condor.png", "retrato_cuygig.png", "retrato_huaca.png"], "assets/music/": ["blues_do_mayor.mp3", "blues_mi_menor.mp3"]};
    const groups = document.getElementById('groups');
    let total = 0;
    let found = 0;
    let pending = 0;

    function summary() {
      document.getElementById('sum').textContent = pending > 0
        ? 'Revisando… (' + found + ' de ' + total + ')'
        : 'Están ' + found + ' de ' + total + ' archivos. Faltan ' + (total - found) + '.';
    }

    function check(path, li) {
      const done = function (ok) {
        li.className = ok ? 'ok' : 'no';
        li.textContent = (ok ? '✓ ' : '✗ ') + li.dataset.name;
        if (ok) found++;
        pending--;
        summary();
      };
      if (/\.mp3$/.test(path)) {
        const a = new Audio();
        a.oncanplaythrough = function () { done(true); a.oncanplaythrough = null; a.onerror = null; };
        a.onerror = function () { done(false); };
        a.preload = 'auto';
        a.src = path;
        return;
      }
      const img = new Image();
      img.onload = function () { done(true); };
      img.onerror = function () { done(false); };
      img.src = path;
    }

    Object.keys(LIST).forEach(function (folder) {
      const h = document.createElement('h2');
      h.textContent = folder + ' (' + LIST[folder].length + ')';
      const ul = document.createElement('ul');
      LIST[folder].forEach(function (name) {
        const li = document.createElement('li');
        li.className = 'wait';
        li.dataset.name = name;
        li.textContent = '… ' + name;
        ul.appendChild(li);
        total++;
        pending++;
        check(folder + name, li);
      });
      groups.appendChild(h);
      groups.appendChild(ul);
    });
    summary();
  </script>
</body>
</html>
